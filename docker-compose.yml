name: pokoscrap
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokoscrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d pokoscrap]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    restart: unless-stopped
  init:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres/pokoscrap
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?Run scripts/configure.py}
    command: [python, -m, server.provision]
    depends_on:
      postgres: {condition: service_healthy}
  dashboard-web:
    build: .
    environment: &web-env
      DATABASE_URL: postgresql+psycopg://pokoweb:${WEB_DB_PASSWORD}@postgres/pokoscrap
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8877}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRIPAY_API_KEY: ${TRIPAY_API_KEY:-}
      TRIPAY_PRIVATE_KEY: ${TRIPAY_PRIVATE_KEY:-}
      TRIPAY_MERCHANT_CODE: ${TRIPAY_MERCHANT_CODE:-}
      BILLING_BETA_ENABLED: ${BILLING_BETA_ENABLED:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pokoscrap.example}
    ports: ["127.0.0.1:${WEB_PORT:-8877}:8765"]
    volumes:
      - "${DATA_DIRECTORY:-./runtime}:/data"
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  gosom-worker:
    build: .
    command: [python, -m, server.worker, jobs]
    environment:
      <<: *web-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres/pokoscrap
      HOST_DATA_PATH: ${HOST_DATA_PATH:?Run scripts/configure.py}
      GOSOM_IMAGE: gosom/google-maps-scraper@sha256:6af44cb9f3393f4791ac5d0d3e2d60d71f785e2dcf9558697c87ff5cc1615c7f
    volumes:
      - ${DATA_DIRECTORY:-./runtime}:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  enrichment-worker:
    build: .
    command: [python, -m, server.worker, enrichment]
    environment:
      <<: *web-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres/pokoscrap
    volumes:
      - "${DATA_DIRECTORY:-./runtime}:/data"
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "${BACKUP_DIRECTORY:-./backups}:/backups"
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        while true; do
        pg_dump -h postgres -U postgres -d pokoscrap -Fc -f /backups/pokoscrap-$$(date -u +%Y%m%d-%H%M%S).dump;
        sleep 86400;
        done
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
